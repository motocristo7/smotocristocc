<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercado Moto CC · Tienda de Repuestos - Servimotos Cristo Centro</title>
    <meta name="description" content="Mercado Moto CC: Tu tienda online de repuestos de motos, accesorios y tapicería en Venezuela. Precios en USD ($) y Bolívares (Bs.) a tasa oficial BCV. Envíos nacionales y taller físico en Mérida." />
    <meta property="og:title" content="Mercado Moto CC · Tienda de Repuestos de Motos" />
    <meta property="og:description" content="Catálogo online de repuestos, lubricantes y accesorios para motos con stock en tiempo real y tasa oficial BCV. Envíos por MRW, Zoom y Tealca." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; padding: 0; background: #f8fafc; color: #0f172a; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #boot-splash { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      #boot-card { max-width: 420px; width: 100%; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06); }
      #boot-spinner { width: 34px; height: 34px; border: 3px solid #e2e8f0; border-top-color: #f59e0b; border-radius: 999px; margin: 0 auto 14px; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot-btn { display: inline-block; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; margin: 4px; }
      .boot-btn-primary { background: #0f172a; color: #ffffff; }
      .boot-btn-secondary { background: #fffbeb; color: #78350f; border-color: #fcd34d; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div id="boot-card">
          <div id="boot-spinner"></div>
          <div style="font-weight:800;font-size:17px;color:#0f172a;">Mercado Moto CC</div>
          <div id="boot-status" style="margin-top:6px;font-size:13px;color:#64748b;">Cargando catálogo y sistema...</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__APP_MOUNTED__ = false;

        function clearBrowserCachesAndReload() {
          try {
            var heavyKeys = [
              'servimotos_products_ve_v2',
              'servimotos_sales_ve_v2',
              'servimotos_service_orders_ve_v2',
              'servimotos_online_orders_ve_v2',
              'servimotos_purchase_orders_ve_v1'
            ];
            for (var i = 0; i < heavyKeys.length; i++) {
              try { localStorage.removeItem(heavyKeys[i]); } catch (e) {}
            }
          } catch (e) {}
          try {
            if ('indexedDB' in window && indexedDB.deleteDatabase) {
              indexedDB.deleteDatabase('servimotos_cache_db_v1');
            }
          } catch (e) {}
          try {
            if ('caches' in window && caches.keys) {
              caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
              });
            }
          } catch (e) {}
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (r) { r.unregister(); });
              });
            }
          } catch (e) {}
          setTimeout(function () {
            try {
              var url = new URL(window.location.href);
              url.searchParams.set('_r', String(Date.now()));
              window.location.replace(url.toString());
            } catch (e) {
              window.location.reload();
            }
          }, 150);
        }

        function showBootRecovery(title, detail) {
          if (window.__APP_MOUNTED__) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div id="boot-splash"><div id="boot-card">' +
            '<div style="font-weight:800;font-size:17px;color:#0f172a;">' + title + '</div>' +
            '<p style="margin:8px 0 14px;font-size:13px;color:#475569;line-height:1.45;">' +
            'Tus datos en la nube están seguros. Recarga la página o limpia la caché local del navegador para entrar de inmediato.</p>' +
            '<div>' +
            '<button id="boot-reload-btn" class="boot-btn boot-btn-primary" type="button">Recargar página</button>' +
            '<button id="boot-reset-btn" class="boot-btn boot-btn-secondary" type="button">Limpiar caché y recargar</button>' +
            '</div>' +
            (detail
              ? '<pre style="margin-top:14px;text-align:left;font-size:11px;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-word;">' +
                String(detail).replace(/[<>&]/g, function (c) {
                  return ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c];
                }) +
                '</pre>'
              : '') +
            '</div></div>';
          var rBtn = document.getElementById('boot-reload-btn');
          var cBtn = document.getElementById('boot-reset-btn');
          if (rBtn) rBtn.onclick = function () { window.location.reload(); };
          if (cBtn) cBtn.onclick = clearBrowserCachesAndReload;
        }

        window.__SHOW_BOOT_RECOVERY__ = showBootRecovery;

        window.addEventListener('error', function (ev) {
          if (!window.__APP_MOUNTED__) {
            var msg = (ev && (ev.message || (ev.error && ev.error.message))) || 'Error cargando módulo de la aplicación.';
            showBootRecovery('No se pudo iniciar la aplicación', msg);
          }
        });

        window.addEventListener('unhandledrejection', function (ev) {
          if (!window.__APP_MOUNTED__) {
            var reason = ev && ev.reason;
            var msg = (reason && (reason.message || String(reason))) || 'Error de red o módulo al iniciar.';
            showBootRecovery('No se pudo iniciar la aplicación', msg);
          }
        });

        setTimeout(function () {
          if (!window.__APP_MOUNTED__) {
            showBootRecovery(
              'La página está tardando demasiado en cargar',
              'Posible conexión lenta o archivo en caché desactualizado.'
            );
          }
        }, 25000);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
